name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run lightweight unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies (envsubst, jq)
        run: sudo apt-get update && sudo apt-get install -y gettext-base jq

      - name: Run all unit tests in CI/tests
        run: bash CI/run_unit_tests.sh
