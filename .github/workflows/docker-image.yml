name: Docker Image CI
on:
  workflow_dispatch:
    inputs:
      test_list:
        description: Only run tests that match the regular expression
        default: ""
        required: false

  push:
    branches: ['main']
  pull_request:


jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.list-scenarios.outputs.scenarios }}
    steps:
      - name: Check out code
        uses: actions/checkout@main
      - name: List scenarios
        id: list-scenarios
        run: |
          echo "scenarios=$(docker compose config --services | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> $GITHUB_OUTPUT

  build-amd64:
    runs-on: ubuntu-latest
    needs: list
    strategy:
      matrix:
        scenario: ${{ fromJson(needs.list.outputs.scenarios) }}
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@main
      - name: Free disk space
        run: |
          sudo docker image prune -af
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Add krknctl metadata to Dockerfiles
        run: |
          bash build.sh
      - name: Get image config
        id: config
        run: |
          IMAGE=$(docker compose config --format json | jq -r '.services["${{ matrix.scenario }}"].image')
          DOCKERFILE=$(docker compose config --format json | jq -r '.services["${{ matrix.scenario }}"].build.dockerfile')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
      - name: Login in quay
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          #platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.config.outputs.image }}
          provenance: false
      # Sign the scenario image so krknctl / krkn-operator (via the shared
      # pkg/verify package) can verify it before running. Sign by the digest
      # emitted by build-push-action (anti-TOCTOU): consumers resolve the tag ->
      # this digest and find the signature. Key-based, --tlog-upload=false, to
      # match the ecosystem's offline verification policy (no Fulcio/Rekor).
      - name: Install cosign
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign scenario image with cosign
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE%:*}@${DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "${REF}"
          # Self-check: fail the build if the signature does not verify with the
          # public half of the signing key (derived on the fly, no extra secret).
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
          cosign verify --insecure-ignore-tlog=true --key /tmp/cosign.pub "${REF}"

  build-multiarch:
    runs-on: ubuntu-latest
    needs: list
    strategy:
      matrix:
        scenario: ${{ fromJson(needs.list.outputs.scenarios) }}
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@main
      - name: Free disk space
        run: |
          sudo docker image prune -af
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Add krknctl metadata to Dockerfiles
        run: |
          bash build.sh
      - name: Get image config
        id: config
        run: |
          IMAGE=$(docker compose config --format json | jq -r '.services["${{ matrix.scenario }}"].image')
          DOCKERFILE=$(docker compose config --format json | jq -r '.services["${{ matrix.scenario }}"].build.dockerfile')

          # Transform krkn-hub to krkn-hub-multiarch for this job
          # Skip cerberus images (they stay amd64-only)
          if echo "$IMAGE" | grep -q "krkn-hub:"; then
            MULTIARCH_IMAGE=$(echo "$IMAGE" | sed 's|/krkn-hub:|/krkn-hub-multiarch:|g')
          else
            MULTIARCH_IMAGE=""
          fi

          echo "image=$MULTIARCH_IMAGE" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
      - name: Login in quay
        if: ${{ github.ref == 'refs/heads/main' && steps.config.outputs.image != '' }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and push multi-platform image
        id: build
        if: ${{ steps.config.outputs.image != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.config.outputs.image }}
          provenance: false
      # Sign the multi-arch scenario image by its manifest-list digest, same
      # policy as build-amd64. Skipped for cerberus (empty image, amd64-only).
      - name: Install cosign
        if: ${{ github.ref == 'refs/heads/main' && steps.config.outputs.image != '' }}
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign scenario image with cosign
        if: ${{ github.ref == 'refs/heads/main' && steps.config.outputs.image != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE%:*}@${DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "${REF}"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
          cosign verify --insecure-ignore-tlog=true --key /tmp/cosign.pub "${REF}"

  notify:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-multiarch]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Call repo lambda
        run: |
          curl --location --request POST '${{ secrets.LAMBDA_URL }}' --header 'Authorization: Bearer ${{ secrets.LAMBDA_TOKEN }}'
